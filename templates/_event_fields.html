{# 追加/編集モーダル共通の活動入力欄。
   呼び出し側は {% with fid = 'add' %} のように一意な接頭辞を渡すこと（id 重複防止） #}
{% set fid = fid | default('event') %}
<div class="mb-3">
  <label class="form-label fw-semibold" for="{{ fid }}-title">
    {{ msg('Title','タイトル') }} <span class="text-danger" aria-hidden="true">*</span>
  </label>
  <input type="text" name="title" id="{{ fid }}-title" class="form-control" required maxlength="200">
</div>
<div class="mb-3">
  <label class="form-label fw-semibold" for="{{ fid }}-date">
    {{ msg('Date','日付') }} <span class="text-danger" aria-hidden="true">*</span>
  </label>
  <input type="date" name="date" id="{{ fid }}-date" class="form-control" required>
</div>
<div class="row g-2">
  <div class="col-6">
    <label class="form-label fw-semibold" for="{{ fid }}-start">
      {{ msg('Start Time','開始時刻') }} <span class="text-danger" aria-hidden="true">*</span>
    </label>
    <input type="time" name="start_time" id="{{ fid }}-start" class="form-control" required>
  </div>
  <div class="col-6">
    <label class="form-label fw-semibold" for="{{ fid }}-end">
      {{ msg('End Time','終了時刻') }} <span class="text-danger" aria-hidden="true">*</span>
    </label>
    <input type="time" name="end_time" id="{{ fid }}-end" class="form-control" required>
  </div>
</div>
